services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # API (tương thích S3)
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ---------------------------------------------------------------
  # Từ đây trở xuống: hạ tầng orchestration, thuộc vai trò Cường
  # (Platform/Orchestration Engineer). Airflow tự host = Cloud Composer
  # local (Mục 4b tài liệu tổng hợp). Postgres đóng 2 vai:
  #   - metadata DB cho Airflow
  #   - data warehouse local nhiều-người-truy-cập (thay DuckKDB khi cần)
  # ---------------------------------------------------------------

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.9.3
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      _PIP_ADDITIONAL_REQUIREMENTS: "duckdb boto3 pandas dbt-core dbt-duckdb kafka-python"
      # Endpoint MinIO đúng tên service trong mạng Docker (không dùng localhost
      # bên trong container) — scripts/upload_to_minio.py đọc biến này.
      MINIO_ENDPOINT: http://minio:9000
    volumes: &airflow-common-volumes
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./:/opt/airflow/repo # mount toàn bộ repo để DAG gọi trực tiếp scripts/ và dbt_logistics/
      - ./dbt_profiles/profiles.yml:/home/airflow/.dbt/profiles.yml
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate && airflow users create --username admin --password admin --firstname Cuong --lastname Platform --role Admin --email admin@example.com || true"

  airflow-webserver:
    image: apache/airflow:2.9.3
    container_name: airflow-webserver
    restart: always
    depends_on:
      - airflow-init
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    ports:
      - "8081:8080" # 8080 đã dùng cho kafka-ui nên map Airflow UI ra 8081
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.9.3
    container_name: airflow-scheduler
    restart: always
    depends_on:
      - airflow-init
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: scheduler

volumes:
  minio_data:
  postgres_data:
  airflow_logs:
