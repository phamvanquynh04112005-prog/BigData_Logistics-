services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # API (tương thích S3)
      - "9001:9001" # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
